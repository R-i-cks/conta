name: checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          node --test core.test.mjs
          node statement.test.mjs
          node stocks.test.mjs
      - name: Server tests
        run: python3 statement_server_test.py
      - name: Browser tests
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 browser_test.py
